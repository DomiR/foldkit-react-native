packages:
  - 'packages/*'
  - 'packages/typing-game/*'
  - 'examples/*'
  - 'comparisons/*'
  - 'internal/*'

allowBuilds:
  '@parcel/watcher': true
  msgpackr-extract: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@effect/platform-browser@4.1.0'
  - '@effect/platform-node-shared@4.1.0'
  - '@effect/platform-node@4.1.0'
  - '@effect/vitest@4.1.0'
  - effect@4.1.0
  - '@effect/tsgo-darwin-arm64@0.50.0'
  - '@effect/tsgo-darwin-x64@0.50.0'
  - '@effect/tsgo-linux-arm64@0.50.0'
  - '@effect/tsgo-linux-arm@0.50.0'
  - '@effect/tsgo-linux-x64@0.50.0'
  - '@effect/tsgo-win32-arm64@0.50.0'
  - '@effect/tsgo-win32-x64@0.50.0'
  - '@effect/tsgo@0.50.0'
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-linking@58.0.16
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23

overrides:
  '@mapbox/jsonlint-lines-primitives': 2.0.2
  '@types/node': 26.4.0
  effect: 4.1.0
  '@effect/platform-browser': 4.1.0
  '@effect/platform-node': 4.1.0
  '@effect/platform-node-shared': 4.1.0
  '@effect/vitest': 4.1.0
  'monaco-editor>dompurify': 3.4.14
